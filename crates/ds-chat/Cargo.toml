[package]
name = "ds-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
futures = "0.3"
ds-core = { path = "../ds-core" }
ds-auth = { path = "../ds-auth" }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"] }
tokio-stream = "0.1"
async-stream = "0.3"
